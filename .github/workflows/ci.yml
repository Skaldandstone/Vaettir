name: CI

permissions:
  contents: read

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '*.md', 'design/**']
  pull_request:
    paths-ignore: ['docs/**', '*.md', 'design/**']

# Cancels a run still going for the same branch when a newer push shows
# up, so a fast burst of commits doesn't queue up several full Postgres +
# pnpm-install + test runs in parallel for commits nobody cares about
# anymore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaettir_ci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaettir_ci_test?schema=public&connection_limit=5
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZGV2LnZhZXR0aXIuZXhhbXBsZS5jb20k
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
      VAETTIR_RELEASE_COMMIT: ${{ github.sha }}
      EXPO_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
      VAETTIR_LIVE_AI_TESTS: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4

      # setup-node v7 uses Node 24 internally; runner >=2.327.1 is required.
      # The application stays on Node 22, with pnpm 11's explicit lower bound.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '>=22.13 <23'
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '>=22.13 <23'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Evidence and health contract tests
        run: node --test scripts/tests/*.test.mjs

      - name: Dependency consumer regressions, when integrated
        run: node scripts/run-dependency-regressions.mjs

      # P10-11: the new router integration test suite (trpc.integration.test.ts)
      # hits a real Postgres connection and depends on the seeded PlanTier
      # rows existing, same as local dev's actual DB already has from past
      # `prisma migrate dev` runs -- CI's blank postgres service container
      # needs both applied explicitly before `pnpm test` runs.
      - name: Apply database migrations
        run: pnpm --filter @vaettir/db exec prisma migrate deploy

      - name: Seed reference data
        run: pnpm --filter @vaettir/db run seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test -- --maxWorkers=2

      - name: Web permission and disposable-fixture contracts, no authentication
        run: |
          node --experimental-strip-types --test apps/web/lib/beta-ui.test.mjs
          pnpm --filter @vaettir/web exec playwright test --config e2e/fixture.config.ts

      # A syntactically valid, non-working test key above is compile-only.
      # Authenticated release tests use real development-instance credentials.
      - name: Production build
        run: pnpm build

      - name: Verify Linux standalone output
        run: |
          test -f apps/web/.next/standalone/apps/web/server.js
          test -d apps/web/.next/static
          node scripts/write-build-evidence.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: build-identity-${{ github.sha }}
          path: .local/build-evidence.json
          include-hidden-files: true
          retention-days: 7
