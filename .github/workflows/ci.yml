name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:

permissions:
  contents: read

# Cancels a run still going for the same branch when a newer push shows
# up, so a fast burst of commits doesn't queue up several full Postgres +
# pnpm-install + test runs in parallel for commits nobody cares about
# anymore.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaettir_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaettir_test?schema=public&connection_limit=5
    steps:
      - uses: actions/checkout@v7

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # P10-11: the new router integration test suite (trpc.integration.test.ts)
      # hits a real Postgres connection and depends on the seeded PlanTier
      # rows existing, same as local dev's actual DB already has from past
      # `prisma migrate dev` runs -- CI's blank postgres service container
      # needs both applied explicitly before `pnpm test` runs.
      - name: Apply database migrations
        run: pnpm --filter @vaettir/db exec prisma migrate deploy

      - name: Seed reference data
        run: pnpm --filter @vaettir/db run seed

      - name: Verify operations contracts
        run: |
          pnpm test:operations
          node --test scripts/retain-sharp-version-receipt.test.mjs
          node --test scripts/native-build-concurrency.test.mjs

      - name: Verify installed native image-processing runtime
        run: node scripts/check-image-runtime.mjs

      - name: Verify restore-drill safety contracts
        run: pnpm test:restore

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Exercise Next's production standalone output on Linux. Windows local
      # builds cannot create pnpm's traced symlinks without developer mode;
      # a small Docker Desktop VM can OOM during trace collection.
      - name: Build production artifacts
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jb20k
          NEXT_PUBLIC_API_URL: https://api.synthetic.example
        run: pnpm build

      - name: Verify standalone native image receipt packaging
        run: node scripts/retain-sharp-version-receipt.mjs
