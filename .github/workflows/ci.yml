name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vaettir
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vaettir?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      # P10-11: the new router integration test suite (trpc.integration.test.ts)
      # hits a real Postgres connection and depends on the seeded PlanTier
      # rows existing, same as local dev's actual DB already has from past
      # `prisma migrate dev` runs -- CI's blank postgres service container
      # needs both applied explicitly before `pnpm test` runs.
      - name: Apply database migrations
        run: pnpm --filter @vaettir/db exec prisma migrate deploy

      - name: Seed reference data
        run: pnpm --filter @vaettir/db run seed

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
