services:
  # Local Postgres for development. Matches the CI service container in
  # .github/workflows/ci.yml (postgres:16, same default user/db shape) so
  # "works in docker-compose" and "works in CI" stay the same claim.
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaettir
    ports:
      - "5432:5432"
    volumes:
      - vaettir-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vaettir-postgres-data:
