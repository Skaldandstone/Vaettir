packages:
  - "apps/*"
  - "packages/*"
overrides:
  # PptxGenJS 4.0.1 declares image-size but its distributed ES/CJS builds do not
  # call it. Scope the fixed major to that exact parent; recheck on parent upgrade.
  'pptxgenjs@4.0.1>image-size': '2.0.3'
  # ExcelJS archive readers reach minimatch 3; retain its compatible brace 1 API.
  'minimatch@3.1.5>brace-expansion': '1.1.21'
  'shell-quote@>=1.8.4 <1.11.0': '1.11.0'
  'undici@>=6.0.0 <6.28.1': '6.28.1'
  'source-map-js@>=1.0.0 <1.2.2': '1.2.2'
  'compression@>=1.0.0 <1.8.2': '1.8.2'
  'ws@7>utf-8-validate': '5.0.10'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  'fast-uri@>=3.0.0 <3.1.8': '3.1.8'
  'fast-uri@>=4.0.0 <4.2.1': '4.2.1'
  'ip-address@>=10.0.0 <10.7.4': '10.7.4'
  'sharp@>=0.34.0 <0.35.5': '0.35.5'
  'postcss@>=8.0.0 <8.5.26': '8.5.26'
allowBuilds:
  '@clerk/shared': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': false
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
